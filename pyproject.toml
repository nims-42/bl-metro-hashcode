[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swim-straggler"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]
dashboard = ["streamlit"]

[project.scripts]
swim-straggler = "swim_straggler.cli:main"

[tool.setuptools.packages.find]
include = ["swim_straggler*"]

[tool.pytest.ini_options]
markers = ["slow: starts several processes; skip with -m 'not slow'"]
