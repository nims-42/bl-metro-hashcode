# make demo: 8 workers train a CNN; worker 4 is slowed 2x from step 50.
name: demo
cluster: {world_size: 8, backend: gloo}
train: {steps: 150, batch_size: 64, learning_rate: 0.05, seed: 0, dataset: mnist}
fault: {kind: compute, workers: [4], multiplier: 2.0, start_step: 50, duration: 0}
detector: {mode: swim, factor: 1.3, consecutive_steps: 5, k_probes: 3, recovery_steps: 20}
