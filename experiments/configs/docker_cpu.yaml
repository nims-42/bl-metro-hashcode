# Containers, one per worker. At step 50 the processor limit of worker 2's container is halved
# (docker update --cpus), so its compute takes about twice as long.
name: docker_cpu
cluster: {world_size: 4, backend: docker, container_cpus: 1.0}
train: {steps: 150, batch_size: 64, dataset: mnist}
fault: {kind: container_cpu, workers: [2], multiplier: 2.0, start_step: 50}
detector: {mode: swim, k_probes: 2}
